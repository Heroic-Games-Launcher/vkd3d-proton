name: Mirror upstream release (.tar.xz)

# HansKristian-Work/vkd3d-proton only ships .tar.zst assets, and Heroic's
# extractor expects .tar.xz. This workflow repackages the official upstream
# asset and publishes it here, so Heroic's `releases/latest` keeps working
# without manual steps.

on:
  schedule:
    # Daily. GitHub may delay scheduled runs a bit; that's fine here.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to mirror (leave empty for the latest stable release)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mirror-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: HansKristian-Work/vkd3d-proton
  # Optional: pin to a major version (for example "2") so the automation
  # doesn't jump to 3.x. Leave empty to always mirror the latest release.
  ALLOWED_MAJOR: ''

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Find latest upstream stable release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          override="${INPUT_TAG}"
          if [ -n "$override" ]; then
            tag="$override"
          elif [ -n "${ALLOWED_MAJOR}" ]; then
            tag=$(gh api "repos/${UPSTREAM_REPO}/releases" --paginate \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              | grep -E "^v${ALLOWED_MAJOR}\." | head -n1 || true)
          else
            tag=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')
          fi

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No matching stable upstream release found."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists in $GITHUB_REPOSITORY, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream tag
        if: steps.upstream.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.upstream.outputs.tag }}
          fetch-depth: 1
          path: upstream

      - name: Repackage .tar.zst as .tar.xz
        if: steps.upstream.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          command -v zstd >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y zstd
          }

          version="${TAG#v}"
          mkdir -p downloaded extracted dist

          gh release download "$TAG" \
            --repo "$UPSTREAM_REPO" \
            --pattern "vkd3d-proton-${version}.tar.zst" \
            --dir downloaded

          archive="downloaded/vkd3d-proton-${version}.tar.zst"
          test -f "$archive"

          tar --zstd -xf "$archive" -C extracted
          tar -cJf "dist/vkd3d-proton-${version}.tar.xz" \
            -C extracted "vkd3d-proton-${version}"

      - name: Push tag to fork
        if: steps.upstream.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          cd upstream
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/tags/${TAG}" --force

      - name: Publish release
        if: steps.upstream.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          asset="dist/vkd3d-proton-${version}.tar.xz"
          test -f "$asset"

          gh release create "$TAG" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Automated mirror of ${UPSTREAM_REPO} ${TAG}, repackaged as .tar.xz for Heroic's tool installer." \
            --verify-tag
